# Ruff config for lambda-base's own Python (index.py + the build-lambda script).
# Mirrors onedata-lambda-utils so the whole v3 system shares one toolchain.
line-length = 100
target-version = "py312"
# build-lambda is a Python script without a .py extension.
extend-include = ["build-lambda"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PL"]
ignore = [
    "PLR0913",  # mirrors onedata-lambda-utils: wide signatures are intentional
]

[lint.isort]
# 2 blank lines after imports, matching automation-examples (shared lambda v3 convention).
lines-after-imports = 2
