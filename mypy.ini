# mypy config for lambda-base's own Python (index.py + the build-lambda script).
# Mirrors onedata-lambda-utils so the whole v3 system shares one toolchain.
[mypy]
python_version = 3.12
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true

# The base deliberately does NOT depend on the SDK: index.py imports it by name at
# runtime, and its presence is enforced at image build time by build-lambda. mypy can't
# see it from here, so don't fail on the unresolved import.
[mypy-onedata_lambda_utils,onedata_lambda_utils.*]
ignore_missing_imports = true
